name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  worker:
    name: Engine — Tier A only (no native solver)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install
        run: pip install -r worker/requirements.txt
      - name: Unit tests (Tier B tests self-skip)
        working-directory: worker
        run: python -m unittest discover -s tests -v

  worker-tier-b:
    name: Engine — Tier A + Tier B (FastHenry2 built from source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install Python deps
        run: pip install -r worker/requirements.txt
      - name: Build FastHenry2 (MIT, 64-bit port) + self-verify
        run: ./scripts/build-fasthenry.sh
      - name: Unit tests with solver present
        working-directory: worker
        env:
          FH_BIN: ${{ github.workspace }}/worker/vendor/fasthenry/fasthenry
        run: python -m unittest discover -s tests -v
      - name: CLI smoke — health reports Tier B
        working-directory: worker
        env:
          FH_BIN: ${{ github.workspace }}/worker/vendor/fasthenry/fasthenry
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, '.')
          from pcb_engine import field
          info = field.solver_info()
          assert info["tier_b_available"], info
          print("tier_b_available:", info["tier_b_available"])
          print("fasthenry:", info["fasthenry"])
          PY

  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - name: Install
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit
      - name: Production build
        working-directory: apps/web
        run: npm run build

  docker:
    name: Docker image builds (worker with solver baked in)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build worker image
        run: docker build -f worker/Dockerfile -t pcb-worker:ci .
      - name: Smoke — container reports Tier B available
        run: |
          docker run -d --name pw -p 8000:8000 pcb-worker:ci
          for i in $(seq 1 30); do
            if curl -sf localhost:8000/health > /tmp/h.json; then break; fi
            sleep 2
          done
          cat /tmp/h.json
          python3 -c "import json;d=json.load(open('/tmp/h.json'));assert d['solvers']['tier_b_available'],d;print('OK: Tier B in container')"
          docker rm -f pw
