services:
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    ports: ["8000:8000"]
    environment:
      ALLOWED_ORIGINS: http://localhost:3000
      TTL_SECONDS: "3600"
    volumes: ["sessions:/data"]
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports: ["3000:3000"]
    environment:
      WORKER_URL: http://worker:8000
    depends_on: [worker]
    restart: unless-stopped

volumes:
  sessions:
